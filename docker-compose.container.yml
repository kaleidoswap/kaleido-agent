services:
  kaleido-mcp:
    image: ghcr.io/kaleidoswap/kaleido-mcp:latest
    platform: linux/amd64
    env_file: .env.container
    environment:
      PORT: 3013
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net');const s=n.connect(3013,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  kaleidoagent-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.container
    environment:
      AGENT_HOST: 0.0.0.0
      CONFIG_PATH: /var/lib/kaleidoagent/agent.config.json
      TASKS_PATH: /var/lib/kaleidoagent/tasks.json
      KALEIDOAGENT_STATE_DIR: /var/lib/kaleidoagent
      KALEIDOAGENT_SKILLS_DIR: /app/kaleidoagent/skills
      KALEIDO_MCP_URL: http://kaleido-mcp:3013
      NANOBOT_KALEIDO_MCP_URL: http://kaleido-mcp:3013
    depends_on:
      kaleido-mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:4242:4242"
    volumes:
      - kaleidoagent_state:/var/lib/kaleidoagent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kaleidoagent-web:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    depends_on:
      kaleidoagent-api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  kaleidoagent_state:
